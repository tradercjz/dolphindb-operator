# Default values for dolphindb-operator.

replicaCount: 1

image:
  repository: 192.168.100.250/dolphindb/operator
  tag: v2.0.0
  pullPolicy: IfNotPresent
  # Optional container command override. Leave empty to use the image ENTRYPOINT,
  # which is the portable choice: images built with a different toolchain (e.g.
  # `ko`, which places binaries under /ko-app/) then work without chart changes.
  command: []
  # Optional args override. Empty means the metrics/health flags below are used.
  args: []

agentImage:
  repository: 192.168.100.250/dolphindb/ddb-agent
  tag: v2.0.0

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Operator metrics & health probe settings
metrics:
  port: 8989
  probePort: 8982

# Prometheus ServiceMonitor configuration
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels:
    release: prometheus

# Built-in DolphinDB Web Console Dashboard
dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: 192.168.100.250/dolphindb/operator
    tag: v2.0.0
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 9527
    nodePort: 30527
  # The dashboard shares the operator image, so its binary must be selected
  # explicitly. Point this at the right path for the image you build, e.g.
  # ["/ko-app/ddb-dashboard"] for a ko-built image.
  command:
    - /ddb-dashboard
  args: []
  # Registry used to prefill the create wizard's image field. Change this for an
  # air-gapped or mirrored installation; the wizard no longer hardcodes a
  # private registry that does not exist on a cloud.
  defaultImage:
    registry: dolphindb
    repository: dolphindb
    version: "3.00.6"
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
