apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dolphindb-operator.fullname" . }}
  labels:
    {{- include "dolphindb-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - pods
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  # Node inventory is required in two places that previously broke on managed
  # Kubernetes: controller placement (getAvailableK8sNodes) and cloud detection
  # for exposure (exposure.DetectProvider reads node.spec.providerID). Without
  # this rule the operator cannot list nodes, so every "expose" silently falls
  # back to NodePort instead of provisioning a cloud load balancer.
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # Informational events emitted while reconciling clusters and nodes.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - get
      - list
      - watch
  # Read-only cluster metadata for the dashboard's create wizard.
  #
  # The wizard needs to offer a namespace and a storage class, and without these
  # rules both dropdowns render empty with a "forbidden at the cluster scope"
  # error - the same class of gap as the missing `nodes` rule.
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - storage.k8s.io
    resources:
      - storageclasses
      - csidrivers
      - csinodes
    verbs:
      - get
      - list
      - watch
  # Used to check whether the operator may actually create a cluster in a given
  # namespace, so the wizard can mark unusable namespaces instead of offering
  # choices that will fail on submit.
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectaccessreviews
    verbs:
      - create
  - apiGroups:
      - dolphindb.io
    resources:
      - ddbbackups
      - ddbnodes
      - ddboperations
      - ddbrestores
      - dolphindbclusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dolphindb.io
    resources:
      - ddbbackups/status
      - ddbnodes/status
      - ddboperations/status
      - ddbrestores/status
      - dolphindbclusters/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - dolphindb.io
    resources:
      - dolphindbclusters/finalizers
    verbs:
      - update
