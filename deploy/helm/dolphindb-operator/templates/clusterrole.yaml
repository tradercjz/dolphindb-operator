apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dolphindb-operator.fullname" . }}
  labels:
    {{- include "dolphindb-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - pods
      - secrets
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dolphindb.io
    resources:
      - ddbbackups
      - ddbnodes
      - ddboperations
      - ddbrestores
      - dolphindbclusters
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - dolphindb.io
    resources:
      - ddbbackups/status
      - ddbnodes/status
      - ddboperations/status
      - ddbrestores/status
      - dolphindbclusters/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - dolphindb.io
    resources:
      - dolphindbclusters/finalizers
    verbs:
      - update
