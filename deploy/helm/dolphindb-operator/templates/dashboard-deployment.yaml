{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dolphindb-operator.fullname" . }}-dashboard
  labels:
    {{- include "dolphindb-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "dolphindb-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "dolphindb-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: {{ include "dolphindb-operator.serviceAccountName" . }}
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          {{- with .Values.dashboard.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.dashboard.args }}
          args:
            {{- toYaml .Values.dashboard.args | nindent 12 }}
          {{- else }}
          args:
            - --listen=:{{ .Values.dashboard.service.port }}
          {{- end }}
          env:
            # The dashboard may run with an empty --namespace ("watch everything").
            # The wizard still needs to know which namespace to default a new
            # cluster to, and this is the only reliable source.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Prefill the create wizard's image field. Configurable per
            # installation so mirrored/air-gapped registries do not require
            # editing the dashboard.
            - name: DDB_IMAGE_REGISTRY
              value: {{ .Values.dashboard.defaultImage.registry | quote }}
            - name: DDB_IMAGE_REPOSITORY
              value: {{ .Values.dashboard.defaultImage.repository | quote }}
            - name: DDB_DEFAULT_VERSION
              value: {{ .Values.dashboard.defaultImage.version | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
