apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dolphindb-operator.fullname" . }}
  labels:
    {{- include "dolphindb-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dolphindb-operator.selectorLabels" . | nindent 6 }}
      # The dashboard Deployment previously shared this exact selector, so the
      # operator's selector also matched dashboard Pods. That makes
      # `kubectl logs deploy/<operator>` pick a random Pod, and leaves two
      # controllers contending for the same Pod set. Give each Deployment its own
      # component label.
      #
      # NOTE: a Deployment selector is immutable. Upgrading an existing release
      # requires deleting the Deployment first (`kubectl delete deploy <name>`),
      # after which Helm recreates it. The Pods are stateless, so this is safe.
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "dolphindb-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dolphindb-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.image.command }}
          command:
            {{- toYaml .Values.image.command | nindent 12 }}
          {{- end }}
          {{- if .Values.image.args }}
          args:
            {{- toYaml .Values.image.args | nindent 12 }}
          {{- else }}
          args:
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.metrics.probePort }}
            - --leader-elect=false
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.metrics.probePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
