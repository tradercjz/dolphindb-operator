apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: dolphindb-pool
  labels:
    app.kubernetes.io/part-of: dolphindb
spec:
  template:
    metadata:
      labels:
        dolphindb.io/workload: cluster
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: dolphindb-nodeclass
      requirements:
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c", "m", "r", "i"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["5"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["on-demand", "spot"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64", "arm64"]
  # Scale to Zero configuration:
  # When DolphinDB is suspended, pods are gracefully terminated.
  # Karpenter detects the nodes are empty and terminates the underlying EC2 instances after 30s.
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    expireAfter: 720h # 30 days
  limits:
    cpu: "256"
    memory: 1024Gi
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: dolphindb-nodeclass
  labels:
    app.kubernetes.io/part-of: dolphindb
spec:
  amiFamily: AL2023
  role: "KarpenterNodeRole-${CLUSTER_NAME}"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${CLUSTER_NAME}"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        deleteOnTermination: true
  tags:
    dolphindb.io/managed-by: karpenter
    karpenter.sh/discovery: "${CLUSTER_NAME}"
