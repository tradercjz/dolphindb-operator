# AWS EBS StorageClasses for DolphinDB
#
# ---------------------------------------------------------------------------
# PREREQUISITE: these classes declare a *provisioner*, they do not install one.
#
# `ebs.csi.aws.com` is the AWS EBS CSI driver, a cluster-level component that the
# cluster administrator installs once per cluster - the same tier as the CNI
# (aws-node) or CoreDNS. It is NOT part of the DolphinDB operator and is not
# shipped with it: it runs privileged DaemonSet pods with hostPath mounts and
# needs IAM permission to call the EC2 volume APIs, which is cluster
# infrastructure, not an application concern.
#
# Applying this file to a cluster without that driver creates StorageClasses that
# look fine but leave every PVC Pending forever:
#
#   ExternalProvisioning: Waiting for a volume to be created either by the external
#   provisioner 'ebs.csi.aws.com' or manually by the system administrator.
#
# Install the driver first, for example:
#
#   # EKS managed add-on with IRSA (the documented path)
#   eksctl create iamserviceaccount \
#     --cluster <cluster> --namespace kube-system \
#     --name ebs-csi-controller-sa \
#     --attach-policy-arn arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy \
#     --approve
#   eksctl create addon --cluster <cluster> --name aws-ebs-csi-driver \
#     --service-account-role-arn <the role created above> --force
#
#   # or a standalone cluster
#   kubectl apply -k "github.com/kubernetes-sigs/aws-ebs-csi-driver/deploy/kubernetes/overlays/stable/?ref=release-1.x"
#
# Verify it registered before relying on these classes:
#
#   kubectl get csinodes -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.drivers[*].name}{"\n"}{end}'
#
# The dashboard reads exactly that, and marks a class whose driver is not running
# as unusable in the create wizard.
#
# Note: `gp2` / `kubernetes.io/aws-ebs` is not an alternative. On modern clusters
# CSI migration forwards that in-tree provisioner to this same driver, so it fails
# identically without it.
# ---------------------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer # 关键：必须等 Pod 调度到具体可用区(AZ)后，再在对应 AZ 动态创建 EBS
allowVolumeExpansion: true             # 支持在线热扩容
parameters:
  type: gp3
  iops: "3000"                         # 生产环境可按需调整 (最高 16000)
  throughput: "125"                    # 生产环境可按需调整 (最高 1000 MB/s)
  encrypted: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-io2-sc
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: io2
  iopsPerGB: "50"                      # io2 Block Express 极低延迟与超高吞吐
  encrypted: "true"
---
# AWS EFS 弹性共享文件系统 (支持多节点 RWX 挂载，推荐用于多节点共享备份与插件)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap             # 基于 EFS Access Point 动态分配挂载点
  directoryPerms: "0755"
---
# AWS FSx for Lustre 极致性能并行文件系统 (超高吞吐，百 GB/s 级)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fsx-lustre-sc
provisioner: fsx.csi.aws.com
mountOptions:
  - flock

