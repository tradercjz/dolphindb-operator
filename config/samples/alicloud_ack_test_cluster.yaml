apiVersion: dolphindb.io/v1alpha1
kind: DolphinDBCluster
metadata:
  name: ddb-ack-test
  namespace: dolphindb
spec:
  version: "v3.00.5"
  mode: "cluster"
  imageRepository: "dolphindb"
  
  # 1. 控制节点：启用 ZoneRequired 反亲和
  controller:
    replicas: 3
    port: 8900
    antiAffinity: "ZoneRequired"
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "1"
        memory: "2Gi"
    storage:
      storageClassName: "alicloud-disk-topology-alltype"
      metaVolumeSize: "20Gi"
    config:
      dfsReplicationFactor: "2"
      dfsReplicaReliabilityLevel: "1"
      dataSync: "1"

  # 2. 数据节点：启用 ZonePreferred 反亲和
  datanode:
    replicas: 3
    port: 8848
    antiAffinity: "ZonePreferred"
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    storage:
      storageClassName: "alicloud-disk-topology-alltype"
      metaVolumeSize: "20Gi"
      dataVolumeCount: 1
      dataVolumeSize: "40Gi"
    config:
      chunkCacheEngineMemSize: "2"
      TSDBCacheEngineSize: "1"

  # 3. 商业 License：虚拟 machine-id 注入
  license:
    mode: "secret"
    secretName: "dolphindb-license"
    machineFingerprint:
      virtualMachineId: "c9fd394d9b50c40bc9a91eacc9e255d6f"
      machineIdSecretName: "dolphindb-license"

  # 4. 网络层：阿里云公网 SLB 声明式注解
  networking:
    serviceType: "LoadBalancer"
    annotations:
      service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: "internet"
      service.beta.kubernetes.io/alibaba-cloud-loadbalancer-spec: "slb.s1.small"
